<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <style>
      .hospital-text-stroke {
        font-family: 'Arial Black', 'Impact', sans-serif;
        font-weight: 900;
        font-size: 72px;
        fill: none;
        stroke: #1B5887;
        stroke-width: 18px;
        stroke-linejoin: round;
      }
      .hospital-text-white {
        font-family: 'Arial Black', 'Impact', sans-serif;
        font-weight: 900;
        font-size: 72px;
        fill: none;
        stroke: #FFFFFF;
        stroke-width: 10px;
        stroke-linejoin: round;
      }
      .hospital-text-fill {
        font-family: 'Arial Black', 'Impact', sans-serif;
        font-weight: 900;
        font-size: 72px;
        fill: #EE3838;
        letter-spacing: -1px;
      }
    </style>

    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#drop-shadow)">
    <!-- Outer Blue Badge Outline -->
    <path d="M 60 230 
             A 190 170 0 0 1 440 230 
             Q 455 230 455 255 
             Q 455 320 420 320 
             Q 400 320 380 325 
             Q 340 335 250 335 
             Q 160 335 120 325 
             Q 100 320 80 320 
             Q 45 320 45 255 
             Q 45 230 60 230 Z" 
          fill="#1B5887" stroke="#1B5887" stroke-width="12" stroke-linejoin="round"/>

    <!-- Inner White Thick Border / Sticker Cut Line -->
    <path d="M 68 230 
             A 180 160 0 0 1 432 230 
             Q 447 230 447 255 
             Q 447 312 415 312 
             Q 395 312 375 317 
             Q 335 327 250 327 
             Q 165 327 125 317 
             Q 105 312 85 312 
             Q 53 312 53 255 
             Q 53 230 68 230 Z" 
          fill="#FFFFFF" />

    <!-- Dark Blue Arch Background -->
    <path d="M 80 230 A 170 150 0 0 1 420 230 Z" fill="#1B5887"/>

    <!-- Grass / Ground Base -->
    <rect x="80" y="215" width="340" height="25" fill="#4CAF50" stroke="#1B5887" stroke-width="3"/>
    
    <!-- Walkway / Entry Path -->
    <polygon points="220,240 280,240 290,215 210,215" fill="#E0E0E0" stroke="#1B5887" stroke-width="2"/>

    <!-- Left Wing Building -->
    <rect x="135" y="150" width="85" height="65" fill="#FFFFFF" stroke="#1B5887" stroke-width="4" stroke-linejoin="round"/>
    <!-- Left Wing Roof -->
    <rect x="130" y="142" width="95" height="10" fill="#1B5887" rx="2"/>
    <!-- Left Windows -->
    <g fill="#87CEEB" stroke="#1B5887" stroke-width="2">
      <rect x="148" y="160" width="16" height="14"/>
      <rect x="170" y="160" width="16" height="14"/>
      <rect x="192" y="160" width="16" height="14"/>
      <rect x="148" y="182" width="16" height="14"/>
      <rect x="170" y="182" width="16" height="14"/>
      <rect x="192" y="182" width="16" height="14"/>
    </g>

    <!-- Right Wing Building -->
    <rect x="280" y="150" width="85" height="65" fill="#FFFFFF" stroke="#1B5887" stroke-width="4" stroke-linejoin="round"/>
    <!-- Right Wing Roof -->
    <rect x="275" y="142" width="95" height="10" fill="#1B5887" rx="2"/>
    <!-- Right Windows -->
    <g fill="#87CEEB" stroke="#1B5887" stroke-width="2">
      <rect x="292" y="160" width="16" height="14"/>
      <rect x="314" y="160" width="16" height="14"/>
      <rect x="336" y="160" width="16" height="14"/>
      <rect x="292" y="182" width="16" height="14"/>
      <rect x="314" y="182" width="16" height="14"/>
      <rect x="336" y="182" width="16" height="14"/>
    </g>

    <!-- Main Central Tower -->
    <rect x="210" y="110" width="80" height="105" fill="#FFFFFF" stroke="#1B5887" stroke-width="4" stroke-linejoin="round"/>
    <!-- Central Roof Rim -->
    <rect x="202" y="102" width="96" height="10" fill="#1B5887" rx="2"/>

    <!-- Red Cross Sign in Red Box -->
    <rect x="230" y="122" width="40" height="32" fill="#EE3838" stroke="#1B5887" stroke-width="2" rx="3"/>
    <!-- White Cross Inside Box -->
    <path d="M 245 128 H 255 V 148 H 245 Z M 238 135 H 262 V 143 H 238 Z" fill="#FFFFFF"/>

    <!-- Entrance Canopy -->
    <rect x="216" y="165" width="68" height="8" fill="#1B5887"/>
    <!-- Glass Double Entrance Doors -->
    <rect x="228" y="173" width="44" height="42" fill="#B0E0E6" stroke="#1B5887" stroke-width="3"/>
    <line x1="250" y1="173" x2="250" y2="215" stroke="#1B5887" stroke-width="2"/>
    <rect x="234" y="185" width="4" height="15" fill="#1B5887"/>
    <rect x="262" y="185" width="4" height="15" fill="#1B5887"/>

    <!-- Ambulance Graphic -->
    <g id="ambulance">
      <rect x="365" y="192" width="38" height="23" fill="#FFFFFF" stroke="#1B5887" stroke-width="2" rx="2"/>
      <path d="M 403 198 L 413 203 L 413 215 L 403 215 Z" fill="#EE3838" stroke="#1B5887" stroke-width="2"/>
      <rect x="365" y="202" width="38" height="6" fill="#EE3838"/>
      <path d="M 374 196 H 378 V 202 H 374 Z M 372 198 H 380 V 200 H 372 Z" fill="#EE3838"/>
      <circle cx="376" cy="216" r="4" fill="#333333" stroke="#1B5887" stroke-width="1.5"/>
      <circle cx="403" cy="216" r="4" fill="#333333" stroke="#1B5887" stroke-width="1.5"/>
    </g>

    <!-- Main Base Line -->
    <line x1="70" y1="240" x2="430" y2="240" stroke="#1B5887" stroke-width="4"/>

    <!-- Text Layer -->
    <text x="250" y="300" text-anchor="middle" class="hospital-text-stroke">HOSPITAL</text>
    <text x="250" y="300" text-anchor="middle" class="hospital-text-white">HOSPITAL</text>
    <text x="250" y="300" text-anchor="middle" class="hospital-text-fill">HOSPITAL</text>
  </g>
</svg>
